# Render Blueprint for the Clubbit backend.
# New → Blueprint → pick this repo. Render creates the web service and prompts
# you for the secret values below (copy them from radar/.env).
services:
  - type: web
    name: clubbit
    runtime: node
    rootDir: radar
    buildCommand: "echo skip"
    startCommand: node server.js
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      - key: BESTTIME_PRIVATE_KEY
        sync: false
      - key: BESTTIME_PUBLIC_KEY
        sync: false
